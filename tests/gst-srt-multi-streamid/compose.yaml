x-runtime-image: &runtime-image
  image: kinugasa-test-runtime
  build:
    context: ../..
    dockerfile: tests/runtime.Dockerfile

services:
  same-id-receiver:
    <<: *runtime-image
    volumes:
      - artifacts:/artifacts
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/receiver.ready"]
      interval: 100ms
      timeout: 1s
      retries: 50
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        rm -f /artifacts/same-id.done /artifacts/same-id.ts
        touch /tmp/receiver.ready
        srt-receive-multi-stream \
          --url 'srt://0.0.0.0:32200?mode=listener' \
          --stream-id shared-camera \
          --output /artifacts/same-id.ts \
          --duration 14 \
          --passphrase kinugasa-aes256-pass \
          --pbkeylen 32
        touch /artifacts/same-id.done
        sleep 30

  same-id-sender-a:
    <<: *runtime-image
    depends_on:
      same-id-receiver:
        condition: service_healthy
    volumes:
      - artifacts:/artifacts
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        sleep 2
        ffmpeg \
          -hide_banner \
          -loglevel error \
          -y \
          -re \
          -f lavfi \
          -i 'testsrc2=size=160x90:rate=10' \
          -re \
          -f lavfi \
          -i 'sine=frequency=880:sample_rate=48000' \
          -t 2 \
          -c:v mpeg2video \
          -g 10 \
          -bf 0 \
          -c:a mp2 \
          -b:a 96k \
          -f mpegts \
          /artifacts/same-id-a-reference.ts
        ffmpeg \
          -hide_banner \
          -loglevel error \
          -y \
          -re \
          -i /artifacts/same-id-a-reference.ts \
          -c copy \
          -f mpegts \
          'srt://same-id-receiver:32200?mode=caller&streamid=shared-camera&passphrase=kinugasa-aes256-pass&pbkeylen=32'

  same-id-sender-b:
    <<: *runtime-image
    depends_on:
      same-id-receiver:
        condition: service_healthy
    volumes:
      - artifacts:/artifacts
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        sleep 6
        ffmpeg \
          -hide_banner \
          -loglevel error \
          -y \
          -re \
          -f lavfi \
          -i 'testsrc2=size=160x90:rate=10,hue=h=45' \
          -re \
          -f lavfi \
          -i 'sine=frequency=1320:sample_rate=48000' \
          -t 2 \
          -c:v mpeg2video \
          -g 10 \
          -bf 0 \
          -c:a mp2 \
          -b:a 96k \
          -f mpegts \
          /artifacts/same-id-b-reference.ts
        ffmpeg \
          -hide_banner \
          -loglevel error \
          -y \
          -re \
          -i /artifacts/same-id-b-reference.ts \
          -c copy \
          -f mpegts \
          'srt://same-id-receiver:32200?mode=caller&streamid=shared-camera&passphrase=kinugasa-aes256-pass&pbkeylen=32'

  same-id-verifier:
    <<: *runtime-image
    depends_on:
      same-id-receiver:
        condition: service_started
      same-id-sender-a:
        condition: service_completed_successfully
      same-id-sender-b:
        condition: service_completed_successfully
    volumes:
      - artifacts:/artifacts
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        timeout 20 bash -c 'until test -f /artifacts/same-id.done; do sleep 0.1; done'
        test -s /artifacts/same-id.ts
        test "$(stat -c '%s' /artifacts/same-id.ts)" -gt 100000
        common_prefix_len() {
          local expected="$$1"
          local actual="$$2"
          local max_len="$$3"
          local low=0
          local high="$${max_len}"
          local mid
          while [ "$${low}" -lt "$${high}" ]; do
            mid="$$(( (low + high + 1) / 2 ))"
            if cmp -s -n "$${mid}" "$${expected}" "$${actual}"; then
              low="$${mid}"
            else
              high="$$((mid - 1))"
            fi
          done
          echo "$${low}"
        }
        ref_a_size="$$(stat -c '%s' /artifacts/same-id-a-reference.ts)"
        ref_b_size="$$(stat -c '%s' /artifacts/same-id-b-reference.ts)"
        actual_size="$$(stat -c '%s' /artifacts/same-id.ts)"
        max_a="$${ref_a_size}"
        if [ "$${actual_size}" -lt "$${max_a}" ]; then
          max_a="$${actual_size}"
        fi
        a_len="$$(common_prefix_len /artifacts/same-id-a-reference.ts /artifacts/same-id.ts "$${max_a}")"
        test "$$((a_len * 100))" -ge "$$((ref_a_size * 80))"
        tail -c +"$$((a_len + 1))" /artifacts/same-id.ts > /tmp/same-id-b-actual.ts
        b_len="$$(stat -c '%s' /tmp/same-id-b-actual.ts)"
        test "$${b_len}" -le "$${ref_b_size}"
        test "$$((b_len * 100))" -ge "$$((ref_b_size * 80))"
        b_matched=0
        for skip in $$(seq 0 188); do
          tail -c +"$$((skip + 1))" /artifacts/same-id-b-reference.ts > /tmp/same-id-b-reference-skip.ts
          if cmp -s -n "$${b_len}" /tmp/same-id-b-reference-skip.ts /tmp/same-id-b-actual.ts; then
            b_matched=1
            break
          fi
        done
        test "$${b_matched}" = 1 || {
          echo "same-id output mismatch: expected prefixes of sender A and sender B references" >&2
          exit 1
        }

  multi-id-receiver:
    <<: *runtime-image
    volumes:
      - artifacts:/artifacts
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/receiver.ready"]
      interval: 100ms
      timeout: 1s
      retries: 50
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        rm -f /artifacts/multi-id.done /artifacts/multi-id-a.ts /artifacts/multi-id-b.ts
        touch /tmp/receiver.ready
        srt-receive-multi-stream \
          --url 'srt://0.0.0.0:32210?mode=listener' \
          --stream-id camera-a \
          --stream-id camera-b \
          --stream-output camera-a=/artifacts/multi-id-a.ts \
          --stream-output camera-b=/artifacts/multi-id-b.ts \
          --duration 12 \
          --passphrase kinugasa-aes256-pass \
          --pbkeylen 32
        touch /artifacts/multi-id.done
        sleep 30

  multi-id-sender-a:
    <<: *runtime-image
    depends_on:
      multi-id-receiver:
        condition: service_healthy
    volumes:
      - artifacts:/artifacts
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        sleep 3
        ffmpeg \
          -hide_banner \
          -loglevel error \
          -y \
          -f lavfi \
          -i 'testsrc2=size=320x180:rate=30' \
          -f lavfi \
          -i 'sine=frequency=1000:sample_rate=48000' \
          -t 2 \
          -c:v mpeg2video \
          -g 15 \
          -bf 0 \
          -c:a mp2 \
          -b:a 128k \
          -f mpegts \
          /artifacts/multi-id-a-reference.ts
        ffmpeg \
          -hide_banner \
          -loglevel error \
          -y \
          -re \
          -i /artifacts/multi-id-a-reference.ts \
          -c copy \
          -f mpegts \
          'srt://multi-id-receiver:32210?mode=caller&streamid=camera-a&passphrase=kinugasa-aes256-pass&pbkeylen=32'

  multi-id-sender-b:
    <<: *runtime-image
    depends_on:
      multi-id-receiver:
        condition: service_healthy
    volumes:
      - artifacts:/artifacts
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        sleep 3
        ffmpeg \
          -hide_banner \
          -loglevel error \
          -y \
          -f lavfi \
          -i 'testsrc2=size=320x180:rate=30,hue=h=45' \
          -f lavfi \
          -i 'sine=frequency=1320:sample_rate=48000' \
          -t 2 \
          -c:v mpeg2video \
          -g 15 \
          -bf 0 \
          -c:a mp2 \
          -b:a 128k \
          -f mpegts \
          /artifacts/multi-id-b-reference.ts
        ffmpeg \
          -hide_banner \
          -loglevel error \
          -y \
          -re \
          -i /artifacts/multi-id-b-reference.ts \
          -c copy \
          -f mpegts \
          'srt://multi-id-receiver:32210?mode=caller&streamid=camera-b&passphrase=kinugasa-aes256-pass&pbkeylen=32'

  multi-id-verifier:
    <<: *runtime-image
    depends_on:
      multi-id-sender-a:
        condition: service_completed_successfully
      multi-id-sender-b:
        condition: service_completed_successfully
    volumes:
      - artifacts:/artifacts
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        timeout 20 bash -c 'until test -f /artifacts/multi-id.done; do sleep 0.1; done'
        compare_prefix_stream() {
          local kind="$$1"
          local expected="$$2"
          local actual="$$3"
          local expected_raw
          local actual_raw
          local expected_hash
          local actual_hash
          local expected_units
          local actual_units
          expected_raw="$$(mktemp)"
          actual_raw="$$(mktemp)"
          test -s "$${expected}"
          test -s "$${actual}"
          if [ "$${kind}" = video ]; then
            expected_units="$$(ffprobe -hide_banner -loglevel error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of default=nk=1:nw=1 "$${expected}" | head -n 1)"
            actual_units="$$(ffprobe -hide_banner -loglevel error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of default=nk=1:nw=1 "$${actual}" | head -n 1)"
            test "$${actual_units}" -le "$${expected_units}"
            test "$$((actual_units * 100))" -ge "$$((expected_units * 80))"
            ffmpeg -hide_banner -loglevel error -y -i "$${expected}" -map 0:v:0 -frames:v "$${actual_units}" -f rawvideo -pix_fmt yuv420p "$${expected_raw}"
            ffmpeg -hide_banner -loglevel error -y -i "$${actual}" -map 0:v:0 -f rawvideo -pix_fmt yuv420p "$${actual_raw}"
            expected_hash="$$(sha256sum "$${expected_raw}" | cut -d ' ' -f 1)"
          else
            ffmpeg -hide_banner -loglevel error -y -i "$${expected}" -map 0:a:0 -f s16le -acodec pcm_s16le -ac 2 -ar 48000 "$${expected_raw}"
            ffmpeg -hide_banner -loglevel error -y -i "$${actual}" -map 0:a:0 -f s16le -acodec pcm_s16le -ac 2 -ar 48000 "$${actual_raw}"
            expected_units="$$(stat -c '%s' "$${expected_raw}")"
            actual_units="$$(stat -c '%s' "$${actual_raw}")"
            test "$${actual_units}" -le "$${expected_units}"
            test "$$((actual_units * 100))" -ge "$$((expected_units * 80))"
            expected_hash="$$(head -c "$${actual_units}" "$${expected_raw}" | sha256sum | cut -d ' ' -f 1)"
          fi
          actual_hash="$$(sha256sum "$${actual_raw}" | cut -d ' ' -f 1)"
          rm -f "$${expected_raw}" "$${actual_raw}"
          test "$${expected_hash}" = "$${actual_hash}" || {
            echo "$${kind} output mismatch for $${actual}: expected $${expected_hash}, got $${actual_hash}" >&2
            exit 1
          }
        }
        compare_prefix_stream video /artifacts/multi-id-a-reference.ts /artifacts/multi-id-a.ts
        compare_prefix_stream audio /artifacts/multi-id-a-reference.ts /artifacts/multi-id-a.ts
        compare_prefix_stream video /artifacts/multi-id-b-reference.ts /artifacts/multi-id-b.ts
        compare_prefix_stream audio /artifacts/multi-id-b-reference.ts /artifacts/multi-id-b.ts

  dynamic-add-receiver:
    <<: *runtime-image
    volumes:
      - artifacts:/artifacts
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/receiver.ready"]
      interval: 100ms
      timeout: 1s
      retries: 50
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        rm -f /artifacts/dynamic-add.done /artifacts/dynamic-add.ts
        touch /tmp/receiver.ready
        srt-receive-multi-stream \
          --url 'srt://0.0.0.0:32220?mode=listener' \
          --stream-output camera-added=/artifacts/dynamic-add.ts \
          --add-stream-id-after camera-added:2 \
          --duration 12 \
          --passphrase kinugasa-aes256-pass \
          --pbkeylen 32
        touch /artifacts/dynamic-add.done
        sleep 30

  dynamic-add-sender:
    <<: *runtime-image
    depends_on:
      dynamic-add-receiver:
        condition: service_healthy
    volumes:
      - artifacts:/artifacts
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        sleep 6
        ffmpeg \
          -hide_banner \
          -loglevel error \
          -y \
          -f lavfi \
          -i 'testsrc2=size=320x180:rate=30' \
          -f lavfi \
          -i 'sine=frequency=1000:sample_rate=48000' \
          -t 2 \
          -c:v mpeg2video \
          -g 15 \
          -bf 0 \
          -c:a mp2 \
          -b:a 128k \
          -f mpegts \
          /artifacts/dynamic-add-reference.ts
        ffmpeg \
          -hide_banner \
          -loglevel error \
          -y \
          -re \
          -i /artifacts/dynamic-add-reference.ts \
          -c copy \
          -f mpegts \
          'srt://dynamic-add-receiver:32220?mode=caller&streamid=camera-added&passphrase=kinugasa-aes256-pass&pbkeylen=32'

  dynamic-add-verifier:
    <<: *runtime-image
    depends_on:
      dynamic-add-sender:
        condition: service_completed_successfully
    volumes:
      - artifacts:/artifacts
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        timeout 20 bash -c 'until test -f /artifacts/dynamic-add.done; do sleep 0.1; done'
        compare_prefix_stream() {
          local kind="$$1"
          local expected="$$2"
          local actual="$$3"
          local expected_raw
          local actual_raw
          local expected_hash
          local actual_hash
          local expected_units
          local actual_units
          expected_raw="$$(mktemp)"
          actual_raw="$$(mktemp)"
          test -s "$${expected}"
          test -s "$${actual}"
          if [ "$${kind}" = video ]; then
            expected_units="$$(ffprobe -hide_banner -loglevel error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of default=nk=1:nw=1 "$${expected}" | head -n 1)"
            actual_units="$$(ffprobe -hide_banner -loglevel error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of default=nk=1:nw=1 "$${actual}" | head -n 1)"
            test "$${actual_units}" -le "$${expected_units}"
            test "$$((actual_units * 100))" -ge "$$((expected_units * 80))"
            ffmpeg -hide_banner -loglevel error -y -i "$${expected}" -map 0:v:0 -frames:v "$${actual_units}" -f rawvideo -pix_fmt yuv420p "$${expected_raw}"
            ffmpeg -hide_banner -loglevel error -y -i "$${actual}" -map 0:v:0 -f rawvideo -pix_fmt yuv420p "$${actual_raw}"
            expected_hash="$$(sha256sum "$${expected_raw}" | cut -d ' ' -f 1)"
          else
            ffmpeg -hide_banner -loglevel error -y -i "$${expected}" -map 0:a:0 -f s16le -acodec pcm_s16le -ac 2 -ar 48000 "$${expected_raw}"
            ffmpeg -hide_banner -loglevel error -y -i "$${actual}" -map 0:a:0 -f s16le -acodec pcm_s16le -ac 2 -ar 48000 "$${actual_raw}"
            expected_units="$$(stat -c '%s' "$${expected_raw}")"
            actual_units="$$(stat -c '%s' "$${actual_raw}")"
            test "$${actual_units}" -le "$${expected_units}"
            test "$$((actual_units * 100))" -ge "$$((expected_units * 80))"
            expected_hash="$$(head -c "$${actual_units}" "$${expected_raw}" | sha256sum | cut -d ' ' -f 1)"
          fi
          actual_hash="$$(sha256sum "$${actual_raw}" | cut -d ' ' -f 1)"
          rm -f "$${expected_raw}" "$${actual_raw}"
          test "$${expected_hash}" = "$${actual_hash}" || {
            echo "$${kind} output mismatch: expected $${expected_hash}, got $${actual_hash}" >&2
            exit 1
          }
        }
        compare_prefix_stream video /artifacts/dynamic-add-reference.ts /artifacts/dynamic-add.ts
        compare_prefix_stream audio /artifacts/dynamic-add-reference.ts /artifacts/dynamic-add.ts

  dynamic-remove-receiver:
    <<: *runtime-image
    volumes:
      - artifacts:/artifacts
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/receiver.ready"]
      interval: 100ms
      timeout: 1s
      retries: 50
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        rm -f /artifacts/dynamic-remove.done /artifacts/dynamic-remove.ts
        touch /tmp/receiver.ready
        srt-receive-multi-stream \
          --url 'srt://0.0.0.0:32230?mode=listener' \
          --stream-id camera-removed \
          --stream-output camera-removed=/artifacts/dynamic-remove.ts \
          --remove-stream-id-after camera-removed:2 \
          --duration 10 \
          --passphrase kinugasa-aes256-pass \
          --pbkeylen 32
        touch /artifacts/dynamic-remove.done
        sleep 30

  dynamic-remove-rejected-sender:
    <<: *runtime-image
    depends_on:
      dynamic-remove-receiver:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        sleep 4
        if ffmpeg \
          -hide_banner \
          -loglevel error \
          -y \
          -re \
          -f lavfi \
          -i 'testsrc2=size=160x90:rate=10' \
          -t 2 \
          -c:v mpeg2video \
          -g 10 \
          -bf 0 \
          -f mpegts \
          'srt://dynamic-remove-receiver:32230?mode=caller&streamid=camera-removed&passphrase=kinugasa-aes256-pass&pbkeylen=32'; then
          echo 'expected removed stream ID connection to be rejected' >&2
          exit 1
        fi

  dynamic-remove-verifier:
    <<: *runtime-image
    depends_on:
      dynamic-remove-receiver:
        condition: service_started
      dynamic-remove-rejected-sender:
        condition: service_completed_successfully
    volumes:
      - artifacts:/artifacts
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        timeout 16 bash -c 'until test -f /artifacts/dynamic-remove.done; do sleep 0.1; done'
        if test -e /artifacts/dynamic-remove.ts; then
          test ! -s /artifacts/dynamic-remove.ts
        fi

  test-of-kinugasa-gst-srt-multi-streamid:
    <<: *runtime-image
    depends_on:
      same-id-verifier:
        condition: service_completed_successfully
      multi-id-verifier:
        condition: service_completed_successfully
      dynamic-add-verifier:
        condition: service_completed_successfully
      dynamic-remove-verifier:
        condition: service_completed_successfully
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        echo 'kinugasa-gst::srt multi-stream-id E2E passed'

volumes:
  artifacts:
