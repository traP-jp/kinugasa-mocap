apiVersion: v1
kind: Namespace
metadata:
  name: recording-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recording-server
  namespace: recording-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: recording-server
rules:
  - apiGroups:
      - recording.kinugasa.dev
    resources:
      - streams
      - recordings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - recording.kinugasa.dev
    resources:
      - streams/status
      - recordings/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: recording-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: recording-server
subjects:
  - kind: ServiceAccount
    name: recording-server
    namespace: recording-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recording-server
  namespace: recording-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recording-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recording-server
    spec:
      serviceAccountName: recording-server
      containers:
        - name: server
          image: recording-server:dev
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:8080
            - --enable-operator
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: recording-server
  namespace: recording-system
  labels:
    app.kubernetes.io/name: recording-server
spec:
  selector:
    app.kubernetes.io/name: recording-server
  ports:
    - name: http
      port: 8080
      targetPort: http
