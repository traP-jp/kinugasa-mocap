apiVersion: v1
kind: Namespace
metadata:
  name: recording-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recording-server
  namespace: recording-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recording-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recording-server
    spec:
      containers:
        - name: server
          image: recording-server:dev
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:8080
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: recording-server
  namespace: recording-system
  labels:
    app.kubernetes.io/name: recording-server
spec:
  selector:
    app.kubernetes.io/name: recording-server
  ports:
    - name: http
      port: 8080
      targetPort: http
